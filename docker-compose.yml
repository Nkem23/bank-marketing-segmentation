services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["pipeline"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
